name: Generate Contribution Snake Animation

on:
  schedule:
    # Run automatically every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Contribution Snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: byjeetrathod2k3
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#55B9FF&color_dots=#161B22,#0D419D,#005FB8,#278CEB,#55B9FF
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#55B9FF&color_dots=#161B22,#0E2D58,#124984,#278CEB,#55B9FF

      - name: Deploy to Output Branch
        run: |
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B output
          git add .
          git commit -m "Update contribution snake animation [skip ci]"
          git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git output
