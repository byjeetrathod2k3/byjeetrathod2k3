# Generates the contribution snake and publishes it to the `output` branch.
#
# Output files (referenced by README.md):
#   output:github-contribution-grid-snake.svg       (light)
#   output:github-contribution-grid-snake-dark.svg  (dark)
#
# Troubleshooting
#   - Push rejected (403): Settings > Actions > General > Workflow permissions
#     must allow "Read and write permissions".
#   - README image is broken: run the workflow once manually (Actions tab >
#     "Generate contribution snake" > Run workflow), then confirm the `output`
#     branch exists and contains both SVG files.
#   - Snake looks stale: raw.githubusercontent.com caches for a few minutes.
#   - Generation step fails: check the Platane/snk release notes for changes.
#   - Scheduled runs pause after 60 days of repository inactivity; re-enable
#     the workflow from the Actions tab if that happens.
name: Generate contribution snake

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"]

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Build snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Check outputs exist
        run: |
          test -s dist/github-contribution-grid-snake.svg
          test -s dist/github-contribution-grid-snake-dark.svg

      - name: Publish to output branch
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update contribution snake"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin output
