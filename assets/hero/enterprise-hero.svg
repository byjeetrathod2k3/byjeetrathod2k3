<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711" />
      <stop offset="40%" stop-color="#080D1A" />
      <stop offset="85%" stop-color="#0B1A30" />
      <stop offset="100%" stop-color="#0879C9" stop-opacity="0.25" />
    </linearGradient>

    <linearGradient id="techBorderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#278CEB" stop-opacity="0" />
      <stop offset="30%" stop-color="#278CEB" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#55B9FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0879C9" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E2F1FF" />
      <stop offset="100%" stop-color="#55B9FF" />
    </linearGradient>

    <pattern id="dotGrid" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#55B9FF" fill-opacity="0.08" />
    </pattern>

    <style>
      .mono-txt { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
      .sans-txt { font-family: 'Space Grotesk', 'Inter', -apple-system, sans-serif; }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.7; }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -40; }
      }
      .circuit-line {
        stroke-dasharray: 6 14;
        animation: dashMove 2.5s linear infinite;
      }
      .beacon-ring {
        animation: pulseGlow 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Canvas Surface -->
  <rect width="1200" height="360" rx="14" fill="url(#bgGrad)" stroke="#102A46" stroke-width="1.5" />
  <rect width="1200" height="360" rx="14" fill="url(#dotGrid)" />

  <!-- Technical Circuit Topography Overlay -->
  <g opacity="0.35">
    <path d="M 0 180 L 320 180 L 380 240 L 720 240 L 760 200 L 1200 200" fill="none" stroke="#278CEB" stroke-width="1" class="circuit-line" />
    <path d="M 120 0 L 120 90 L 180 150 L 540 150" fill="none" stroke="#55B9FF" stroke-width="0.8" opacity="0.5" />
    <circle cx="380" cy="240" r="3" fill="#55B9FF" />
    <circle cx="760" cy="200" r="3" fill="#278CEB" />
    <circle cx="180" cy="150" r="2.5" fill="#55B9FF" />
  </g>

  <!-- Right Geometric Radar / Engineering Reticle -->
  <g transform="translate(1000, 180)">
    <circle cx="0" cy="0" r="110" fill="none" stroke="#102A46" stroke-width="1" />
    <circle cx="0" cy="0" r="80" fill="none" stroke="#278CEB" stroke-width="1" opacity="0.4" stroke-dasharray="8 6" />
    <circle cx="0" cy="0" r="45" fill="none" stroke="#55B9FF" stroke-width="1.2" class="beacon-ring" />
    <line x1="-120" y1="0" x2="120" y2="0" stroke="#102A46" stroke-width="1" />
    <line x1="0" y1="-120" x2="0" y2="120" stroke="#102A46" stroke-width="1" />
    <circle cx="0" cy="0" r="3" fill="#55B9FF" />
    <text x="50" y="-85" fill="#55B9FF" font-size="10" opacity="0.7" class="mono-txt">SYS_ARCH::2026</text>
  </g>

  <!-- Status Chip -->
  <g transform="translate(70, 52)">
    <rect width="215" height="26" rx="6" fill="#0D1728" stroke="#278CEB" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="14" cy="13" r="4" fill="#55B9FF">
      <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="26" y="17" fill="#55B9FF" font-size="11" font-weight="600" letter-spacing="1.2" class="mono-txt">ENTERPRISE SOLUTIONS</text>
  </g>

  <!-- Primary Identity Typography -->
  <text x="70" y="145" fill="url(#textGrad)" font-size="62" font-weight="800" letter-spacing="-1.2" class="sans-txt">JEET RATHOD</text>

  <!-- Subtitle Matrix -->
  <text x="72" y="185" fill="#8EA9C7" font-size="15" font-weight="500" letter-spacing="2.2" class="mono-txt">SOFTWARE DEVELOPER  |  SOLUTIONS ADVISOR  |  CONSULTANT</text>

  <!-- Technical Divider Line -->
  <rect x="70" y="215" width="840" height="1.5" fill="url(#techBorderGrad)" />

  <!-- Strategic Value Proposition -->
  <g transform="translate(72, 252)">
    <text x="0" y="0" fill="#E2F1FF" font-size="15" font-weight="500" class="sans-txt">Bridging enterprise operations and resilient system architecture.</text>
    <text x="0" y="24" fill="#55B9FF" font-size="13" font-weight="400" class="mono-txt">ERP/CRM/MES Engines  ·  Data Architecture  ·  Full-Stack Platforms  ·  Process Automation</text>
  </g>

  <!-- Terminal Telemetry Pill -->
  <g transform="translate(70, 308)">
    <text x="0" y="0" fill="#4B6A90" font-size="11" class="mono-txt">LOC: AHMEDABAD, IN  |  ORG: CYPRAON PRIVATE LIMITED  |  ENV: PRODUCTION</text>
  </g>
</svg>
