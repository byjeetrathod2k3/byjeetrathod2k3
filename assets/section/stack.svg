<title id="t">Technology stack</title>
<desc id="d">Languages: Python, JavaScript, TypeScript, Node.js, Dart. Frameworks: NestJS, Django, Flutter. Databases: Microsoft SQL Server, MySQL, PostgreSQL, MongoDB, Supabase. Data engineering: T-SQL, SSIS, Stored procedures, Functions, Views, CTEs, Indexing, ETL, Data migration, Query optimization. Business intelligence: Power BI, Advanced Excel, Power Query, MIS reporting, Business dashboards. Tools: Git, GitHub, Docker, Linux, VS Code, Visual Studio, Postman, Figma.</desc>
