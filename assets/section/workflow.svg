<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 190" width="860" height="190" role="img" aria-labelledby="t d">
<title id="t">Engineering workflow</title>
<desc id="d">Five stages: diagnose the bottleneck, model the data, architect the system, build and integrate, report and refine.</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#55B9FF" stroke-opacity=".06"/></pattern><linearGradient id="ws" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0879C9" stop-opacity="0"/><stop offset=".5" stop-color="#55B9FF"/><stop offset="1" stop-color="#0879C9" stop-opacity="0"/><animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="6s" begin="0s" repeatCount="indefinite"/></linearGradient></defs>
<rect width="860" height="190" rx="4" fill="#080D19"/><rect width="860" height="190" rx="4" fill="url(#grid)"/><line x1="90" y1="88" x2="770" y2="88" stroke="#278CEB" stroke-opacity=".35"/><line x1="90" y1="88" x2="770" y2="88" stroke="url(#ws)" stroke-width="2"/><circle r="4" fill="#55B9FF"><animateMotion dur="8s" repeatCount="indefinite" path="M90 88 H770"/></circle><circle cx="90" cy="88" r="16" fill="#0D1728" stroke="#55B9FF" stroke-width="1.5"/><text x="90" y="93" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="13" fill="#55B9FF">1</text><text x="90" y="132" text-anchor="middle" font-family="'Space Grotesk','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#E6EEF8">Diagnose</text><text x="90" y="154" text-anchor="middle" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8FA6BF">Find the bottleneck</text><circle cx="260" cy="88" r="16" fill="#0D1728" stroke="#55B9FF" stroke-width="1.5"/><text x="260" y="93" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="13" fill="#55B9FF">2</text><text x="260" y="132" text-anchor="middle" font-family="'Space Grotesk','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#E6EEF8">Model</text><text x="260" y="154" text-anchor="middle" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8FA6BF">Shape the data</text><circle cx="430" cy="88" r="16" fill="#0D1728" stroke="#55B9FF" stroke-width="1.5"/><text x="430" y="93" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="13" fill="#55B9FF">3</text><text x="430" y="132" text-anchor="middle" font-family="'Space Grotesk','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#E6EEF8">Architect</text><text x="430" y="154" text-anchor="middle" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8FA6BF">Choose the system</text><circle cx="600" cy="88" r="16" fill="#0D1728" stroke="#55B9FF" stroke-width="1.5"/><text x="600" y="93" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="13" fill="#55B9FF">4</text><text x="600" y="132" text-anchor="middle" font-family="'Space Grotesk','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#E6EEF8">Build</text><text x="600" y="154" text-anchor="middle" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8FA6BF">Integrate and automate</text><circle cx="770" cy="88" r="16" fill="#0D1728" stroke="#55B9FF" stroke-width="1.5"/><text x="770" y="93" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="13" fill="#55B9FF">5</text><text x="770" y="132" text-anchor="middle" font-family="'Space Grotesk','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#E6EEF8">Report</text><text x="770" y="154" text-anchor="middle" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8FA6BF">Measure and refine</text><text x="430.0" y="40" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12" letter-spacing="2" fill="#8FA6BF">FROM BUSINESS PROBLEM TO WORKING SYSTEM</text>
</svg>
